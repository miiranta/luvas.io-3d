<div class="backdrop" (click)="dismissed.emit()"></div>

<div class="dialog" role="alertdialog">
    <p class="message">{{ message() }}</p>
    @if (detail()) {
        <p class="detail">{{ detail() }}</p>
    }
    <div class="actions">
        <button type="button" class="ghost" (click)="dismissed.emit()">Cancel</button>
        <button type="button" class="danger" (click)="confirmed.emit()">
            {{ confirmLabel() }}
        </button>
    </div>
</div>
