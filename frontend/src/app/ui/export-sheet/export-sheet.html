<div class="backdrop" (click)="close.emit()"></div>

<div class="dialog" role="dialog" aria-label="Export">
    <header>
        <h2>Export</h2>
        <button type="button" class="round-action close" title="Close" (click)="close.emit()">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path
                    d="M6.5 6.5l11 11M17.5 6.5l-11 11"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.8"
                    stroke-linecap="round"
                />
            </svg>
        </button>
    </header>
    @for (choice of choices; track choice.format) {
        <button
            type="button"
            class="choice"
            [class.working]="saving() === choice.format"
            [disabled]="saving() !== null"
            (click)="save(choice)"
        >
            <b>{{ choice.title }}</b>
            <span>{{ choice.detail }}</span>
        </button>
    }
</div>
